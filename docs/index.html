<style>
:root {
  --bg: #0f172a; --card: #1e293b; --text: #e2e8f0;
  --text2: #94a3b8; --border: #334155; --r: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
}
.header {
  padding:16px 24px; background:var(--card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:24px; flex-wrap:wrap;
}
.header h1 { font-size:1.2em; white-space:nowrap; }
.btn-group { display:flex; gap:6px; }
.btn-group label { font-size:13px; color:var(--text2); margin-right:4px; align-self:center; }
.btn {
  padding:8px 18px; border:1px solid var(--border); border-radius:6px;
  background:var(--card); color:var(--text2); cursor:pointer; font-size:13px;
  transition:all .15s; white-space:nowrap;
}
.btn:hover { border-color:#64748b; color:var(--text); }
.btn.active { background:var(--border); color:var(--text); font-weight:600; }
.btn.stock.active-stock { background:#1e40af; border-color:#3b82f6; color:#fff; }
.chart-wrap { width:100%; height:520px; }
.metrics-panel {
  display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
  padding:24px; max-width:1200px; margin:0 auto;
}
.metric-card {
  background:var(--card); border-radius:var(--r); padding:16px 20px;
  border:1px solid var(--border);
}
.metric-card .label { font-size:12px; color:var(--text2); margin-bottom:4px; }
.metric-card .value { font-size:1.5em; font-weight:700; }
.metric-card .sub { font-size:12px; color:var(--text2); margin-top:4px; }
.up { color:#ef4444; }
.down { color:#22c55e; }
.neutral { color:#f59e0b; }
.warn { color:#f59e0b; }
.info-row {
  display:flex; gap:48px; padding:0 24px 16px; color:var(--text2); font-size:13px;
}
@media (max-width: 800px) {
  .metrics-panel { grid-template-columns:repeat(2,1fr); }
  .header { gap:12px; }
}
</style>

        itemStyle: {
          color: "#ef4444", color0: "#22c55e",
          borderColor: "#ef4444", borderColor0: "#22c55e",
        },
      },
      // Buy markers (red up-triangle on buy_price)
      {
        name: "买入信号",
        type: "scatter", xAxisIndex: 0, yAxisIndex: 0,
        data: buyData.map(d => d.coord),
        symbol: "arrow",
        symbolSize: 18,
        symbolRotate: 0,
        itemStyle: { color: "#ef4444" },
        z: 10,
        tooltip: {
          trigger: "item",
          formatter: p => '<b style="color:#ef4444">🔺 买入</b><br/>日期: ' + p.value[0] + '<br/>价格: ¥' + p.value[1].toFixed(2),
        },
      },
      // Sell markers (green down-triangle on sell_price)
      {
        name: "卖出信号",
        type: "scatter", xAxisIndex: 0, yAxisIndex: 0,
        data: sellData.map(d => d.coord),
        symbol: "arrow",
        symbolSize: 18,
        symbolRotate: 180,
        itemStyle: { color: "#22c55e" },
        z: 10,
        tooltip: {
          trigger: "item",
          formatter: p => '<b style="color:#22c55e">🔻 卖出</b><br/>日期: ' + p.value[0] + '<br/>价格: ¥' + p.value[1].toFixed(2),
        },
      },
      // MA short
      {
        name: "MA" + strat.short_ma,
        type: "line", xAxisIndex: 0, yAxisIndex: 0,
        data: maShort,
        smooth: true, symbol: "none",
        lineStyle: { color: "#f59e0b", width: 1.2 },
      },
      // MA long
      {
        name: "MA" + strat.long_ma,
        type: "line", xAxisIndex: 0, yAxisIndex: 0,
        data: maLong,
        smooth: true, symbol: "none",
        lineStyle: { color: "#a78bfa", width: 1.2 },
      },
      // Volume
      {
        name: "成交量",
        type: "bar", xAxisIndex: 1, yAxisIndex: 1,
        data: volumes.map((v, i) => {
          const prev = i > 0 ? ohlc[i-1][1] : ohlc[i][0];
          const cl = ohlc[i][1];
          return cl >= prev
            ? { value: v, itemStyle: { color: "rgba(239,68,68,0.5)" } }
            : { value: v, itemStyle: { color: "rgba(34,197,94,0.4)" } };
        }),
      },
    ],
  };

  myChart.setOption(option, true);
}

// ============ BUILD METRICS ============
function buildMetrics() {
  const stock = STOCKS[currentStock];
  const strat = stock.metrics.strategies[STRATEGY_KEYS.indexOf(currentStrategy)];
  const metricsDiv = document.getElementById("metrics");

  const items = [
    { label:"累计回报", value:strat.cumulative_return.toFixed(2)+"%", cls:strat.cumulative_return>=0?"up":"down", sub:"买入持有 "+strat.buy_hold_return.toFixed(2)+"%" },
    { label:"超额收益", value:(strat.excess_return>=0?"+":"")+strat.excess_return.toFixed(2)+"%", cls:strat.excess_return>=0?"up":"down" },
    { label:"最大回撤 (MDD)", value:strat.max_drawdown.toFixed(2)+"%", cls:strat.max_drawdown<-20?"warn":"neutral",
      sub:"日期 "+strat.mdd_date },
    { label:"夏普比率", value:strat.sharpe_ratio.toFixed(2), cls:strat.sharpe_ratio>=1?"up":strat.sharpe_ratio>=0.5?"neutral":"warn" },
    { label:"Calmar比率", value:strat.calmar_ratio.toFixed(2), cls:strat.calmar_ratio>=1?"up":"neutral" },
    { label:"年化收益", value:strat.annualized_return.toFixed(2)+"%", cls:strat.annualized_return>=0?"up":"down" },
    { label:"胜率", value:strat.win_rate.toFixed(1)+"%", cls:strat.win_rate>=50?"up":"warn",
      sub:strat.win_trades+"胜 / "+(strat.total_trades-strat.win_trades)+"负 / 共"+strat.total_trades+"笔" },
    { label:"盈亏比", value:strat.profit_loss_ratio.toFixed(2), cls:strat.profit_loss_ratio>=2?"up":strat.profit_loss_ratio>=1?"neutral":"warn" },
    { label:"平均盈利", value:"+"+strat.avg_win_pct.toFixed(2)+"%", cls:"up", sub:"平均持仓 "+strat.avg_hold_days.toFixed(0)+" 天" },
    { label:"平均亏损", value:strat.avg_loss_pct.toFixed(2)+"%", cls:"down" },
  ];

  metricsDiv.innerHTML = items.map(m => `
    <div class="metric-card">
      <div class="label">${m.label}</div>
      <div class="value ${m.cls}">${m.value}</div>
      ${m.sub ? '<div class="sub">'+m.sub+'</div>' : ''}
    </div>
  `).join("");
}

// ============ EVENT HANDLERS ============
document.querySelectorAll(".btn.stock").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".btn.stock").forEach(b => b.classList.remove("active-stock"));
    this.classList.add("active-stock");
    currentStock = this.dataset.stock;
    buildChart();
    buildMetrics();
  });
});

document.querySelectorAll(".btn.strategy").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".btn.strategy").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    currentStrategy = this.dataset.strategy;
    buildChart();
    buildMetrics();
  });
});

// ============ INIT ============
buildChart();
buildMetrics();

// Responsive
window.addEventListener("resize", () => myChart.resize());
</script>
</body>
</html>
